# Checks every push and pull request to main with the same gate as the
# weekly release (.github/workflows/release.yml) and scripts/hooks/pre-push.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          if ($LASTEXITCODE -ne 0) { throw "installing staticcheck failed" }

      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw "tsc failed" }
          # main.go embeds frontend/dist, so it must exist before go build/vet/test.
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "frontend build failed" }

      - name: Go build, vet, staticcheck and tests
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed" }
          staticcheck ./...
          if ($LASTEXITCODE -ne 0) { throw "staticcheck failed" }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "go test failed" }
